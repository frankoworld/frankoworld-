<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrankoWorld 3.0</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Arial}
body{background:#f0f2f5}
.top{background:#fff;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.logo{font-weight:800;font-size:22px}.logo b{color:#1877f2}.logo i{color:#00c851;font-style:normal}
.feed{max-width:680px;margin:0 auto}
.stories{display:flex;gap:8px;overflow:auto;padding:12px;background:#fff;margin-top:8px}
.story{min-width:110px;height:180px;border-radius:12px;background:#e4e6eb;position:relative;overflow:hidden}
.post{background:#fff;margin-top:8px;border-radius:8px;overflow:hidden}
.post-head{padding:12px;display:flex;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1877f2,#00c851);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.post-img{width:100%;max-height:500px;object-fit:cover;background:#000}
.btns{display:flex;border-top:1px solid #e4e6eb}
.btn{flex:1;padding:12px;text-align:center;font-weight:600;color:#65676b;cursor:pointer}
.create{background:#fff;margin-top:8px;padding:12px;display:flex;gap:8px;align-items:center}
.input{flex:1;background:#f0f2f5;padding:10px 16px;border-radius:20px;color:#65676b}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center;padding:12px}
#modal.open{display:flex}
.box{background:#fff;width:100%;max-width:500px;border-radius:12px;padding:16px}
textarea{width:100%;min-height:90px;border:none;outline:none;font-size:18px;resize:none}
.preview{margin-top:10px;border-radius:10px;overflow:hidden;display:none}
.preview img,.preview video{width:100%}
.btn-blue{background:#1877f2;color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:800;margin-top:10px}
</style>
</head>
<body>
<div class="top"><div class="logo"><b>franko</b><i>world</i> 3.0</div><div>🔍 💬 🔔</div></div>
<div class="feed">
<div class="stories">
<div class="story" onclick="openM()" style="display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;border:1px solid #ddd"><div style="width:40px;height:40px;background:#1877f2;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px">+</div><b style="margin-top:8px;font-size:13px">Create story</b></div>
<div class="story" style="background:#ffb400;display:flex;align-items:center;justify-content:center;font-size:40px">🔥<span style="position:absolute;bottom:8px;left:8px;color:#fff;font-size:12px;font-weight:700">Franko's Day</span></div>
<div class="story" style="background:#00d4aa;display:flex;align-items:center;justify-content:center;font-size:40px">🌴<span style="position:absolute;bottom:8px;left:8px;color:#fff;font-size:12px;font-weight:700">Lagos Vibes</span></div>
</div>
<div class="create"><div class="avatar">F</div><div class="input" onclick="openM()">What's on your mind, Franko?</div><div>🖼️</div></div>
<div id="feed"></div>
</div>
<div id="modal"><div class="box">
<div style="display:flex;justify-content:space-between"><b>Create Post</b><span onclick="closeM()" style="cursor:pointer">✕</span></div>
<textarea id="txt" placeholder="What's on your mind?"></textarea>
<div class="preview" id="prev"></div>
<label style="display:block;background:#f0f2f5;padding:12px;border-radius:8px;text-align:center;margin-top:10px;cursor:pointer">📸 Tap to choose photo/video<input type="file" id="file" accept="image/*,video/*" style="display:none"></label>
<button class="btn-blue" onclick="post()">Post Now</button>
</div></div>
<script>
let posts=JSON.parse(localStorage.getItem('fw3')||'null')||[{t:"Welcome to FrankoWorld 3.0! Post photo/video like Facebook 🔥",l:124,c:12,liked:false},{t:"Afro Dance 💃 challenge!",bg:"#ff6b9d",e:"💃",l:2100,c:342,liked:false}];
let media=null, mtype=null;
function render(){
 let f=document.getElementById('feed');f.innerHTML='';
 posts.forEach((p,i)=>{
  f.innerHTML+=`<div class="post"><div class="post-head"><div class="avatar">F</div><div><b>FrankoWorld</b><div style="font-size:12px;color:#65676b">now • 🌍</div></div></div>${p.t?`<div style="padding:0 12px 10px">${p.t}</div>`:''}${p.img? (p.mtype=='video'?`<video class="post-img" src="${p.img}" controls></video>`:`<img class="post-img" src="${p.img}">`) : (p.bg?`<div style="height:300px;background:${p.bg};display:flex;align-items:center;justify-content:center;font-size:80px">${p.e}</div>`:'')}<div style="padding:8px 12px;display:flex;justify-content:space-between;font-size:13px;color:#65676b"><span>👍 ${p.l} likes</span><span>${p.c} comments</span></div><div class="btns"><div class="btn" onclick="like(${i})" style="color:${p.liked?'#1877f2':''}">👍 Like</div><div class="btn">💬 Comment</div><div class="btn">↗️ Share</div></div></div>`;
 });
}
function openM(){document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open');document.getElementById('txt').value='';document.getElementById('prev').style.display='none';document.getElementById('prev').innerHTML='';media=null}
document.getElementById('file').addEventListener('change',e=>{
 let file=e.target.files[0]; if(!file) return;
 let r=new FileReader(); r.onload=ev=>{
  media=ev.target.result; mtype=file.type.startsWith('video')?'video':'image';
  let pv=document.getElementById('prev'); pv.style.display='block';
  pv.innerHTML=mtype=='video'?`<video src="${media}" controls></video>`:`<img src="${media}">`;
 }; r.readAsDataURL(file);
});
function post(){
 let t=document.getElementById('txt').value;
 if(!t &&!media) return alert('Write something or add photo');
 posts.unshift({t,img:media,mtype,l:0,c:0,liked:false});
 localStorage.setItem('fw3',JSON.stringify(posts));
 render(); closeM();
}
function like(i){posts[i].liked=!posts[i].liked; posts[i].l+=posts[i].liked?1:-1; localStorage.setItem('fw3',JSON.stringify(posts)); render();}
render();
</script>
</body>
</html>
