<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrankoWorld</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f0f2f5;padding-bottom:65px}
.top{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.logo{color:#0866ff;font-weight:900;font-size:28px;letter-spacing:-1px}
.icons{display:flex;gap:12px;font-size:22px}
.create-box{background:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center;margin-top:6px}
.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0866ff,#00c851);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}
.input{flex:1;background:#f0f2f5;border-radius:20px;padding:10px 14px;color:#65676b}
.stories{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;margin-top:6px}
.story-card{min-width:110px;height:180px;border-radius:12px;position:relative;overflow:hidden;flex-shrink:0;background:#e4e6eb}
.story-card.create{background:#fff;border:1px solid #ddd;display:flex;flex-direction:column}
.story-img{width:100%;height:70%;object-fit:cover}
.story-bottom{padding:6px;text-align:center;font-weight:700;font-size:13px}
.plus{position:absolute;top:58%;left:50%;transform:translate(-50%,-50%);background:#0866ff;color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;font-size:22px}
.post{background:#fff;margin-top:8px;padding:12px}
.post-head{display:flex;gap:8px;align-items:center}
.post-img,.post-video{width:100%;margin-top:10px;border-radius:8px;max-height:500px;object-fit:cover;background:#000}
.actions{display:flex;justify-content:space-between;padding:10px 0 0;border-top:1px solid #e4e6eb;margin-top:10px;color:#65676b;font-weight:600}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd;z-index:20}
.nav-item{text-align:center;font-size:11px;color:#65676b}
.nav-item.active{color:#0866ff}
.nav-icon{font-size:22px;display:block}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center;padding:15px}
#modal.open{display:flex}
.box{background:#fff;width:100%;max-width:500px;border-radius:12px;padding:15px}
textarea{width:100%;border:none;outline:none;font-size:20px;min-height:80px;resize:none}
.page{display:none}.page.active{display:block}
.reel-video{width:100%;height:calc(100vh - 110px);object-fit:cover;background:#000}
</style>
</head>
<body>

<div class="top">
<div style="display:flex;gap:12px;align-items:center"><span style="font-size:26px">☰</span><span class="logo">facebook</span></div>
<div class="icons"><span>⊕</span><span>🔍</span><span style="position:relative">💬<span style="position:absolute;top:-6px;right:-6px;background:red;color:#fff;font-size:10px;padding:2px 5px;border-radius:10px">9+</span></span></div>
</div>

<!-- HOME PAGE -->
<div id="homePage" class="page active">
<div class="create-box"><div class="avatar">F</div><div class="input" onclick="openModal()">What's on your mind?</div><span>🖼️</span></div>

<div class="stories">
<div class="story-card create" onclick="openModal()"><div style="height:70%;background:#ddd"></div><div class="plus">+</div><div class="story-bottom">Create<br>story</div></div>
<div class="story-card"><img src="https://i.pravatar.cc/200?img=5" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:6px;left:6px;color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 2px #000">Kenny Wise</div></div>
<div class="story-card"><img src="https://i.pravatar.cc/200?img=8" style="width:100%;height:100%;object-fit:cover"><div style="position:absolute;bottom:6px;left:6px;color:#fff;font-weight:700;font-size:12px">Solomon Otu</div></div>
<div class="story-card"><div style="width:100%;height:100%;background:#ffb400;display:flex;align-items:center;justify-content:center;font-size:50px">🔥</div><div style="position:absolute;bottom:6px;left:6px;color:#fff;font-weight:700;font-size:12px">Franko's Day</div></div>
</div>

<div id="feed"></div>
</div>

<!-- REELS PAGE -->
<div id="reelsPage" class="page">
<div id="reelsFeed"></div>
</div>

<!-- MODAL -->
<div id="modal"><div class="box">
<div style="display:flex;justify-content:space-between"><b>Create Post</b><span onclick="closeModal()" style="cursor:pointer">✕</span></div>
<textarea id="txt" placeholder="What's on your mind, Franko?"></textarea>
<div id="preview" style="display:none;margin-top:10px"></div>
<label style="display:block;background:#f0f2f5;padding:12px;border-radius:8px;text-align:center;margin-top:10px;cursor:pointer">📸 Tap to add photo/video<input type="file" id="file" accept="image/*,video/*" style="display:none"></label>
<button onclick="makePost()" style="width:100%;background:#0866ff;color:#fff;border:none;padding:12px;border-radius:8px;font-weight:800;margin-top:12px">Post</button>
</div></div>

<div class="bottom-nav">
<div class="nav-item active" onclick="showPage('home',this)"><span class="nav-icon">🏠</span>Home</div>
<div class="nav-item" onclick="showPage('reels',this)"><span class="nav-icon">🎬</span>Reels</div>
<div class="nav-item"><span class="nav-icon">👥</span>Friends</div>
<div class="nav-item"><span class="nav-icon">🔔</span>Notifications</div>
<div class="nav-item"><span class="nav-icon">👤</span>Profile</div>
</div>

<script>
let posts=JSON.parse(localStorage.getItem('fw4')||'null')||[
{t:"Another year older, wiser, and closer to everything I prayed for. 🎂❤️ Welcome to FrankoWorld!",img:"",likes:124,liked:false, name:"Søn Óf Màn is 🎉 celebrating a birthday with Terry Ntiero and 11 others.", time:"3d • 🌍"},
{t:"My first video on FrankoWorld! 🔥 No more error!",video:"",likes:89,liked:false,name:"Franko",time:"now • 🌍"}
];
let tempMedia=null, tempType=null;

function render(){
let f=document.getElementById('feed'); f.innerHTML='';
let rf=document.getElementById('reelsFeed'); rf.innerHTML='';
posts.forEach((p,i)=>{
let media = p.img? `<img class="post-img" src="${p.img}">` : p.video? `<video class="post-video" src="${p.video}" controls playsinline></video>` : (p.bg? `<div style="height:300px;background:${p.bg};display:flex;align-items:center;justify-content:center;font-size:80px;border-radius:8px;margin-top:10px">${p.e}</div>`:`<div style="height:280px;background:#222;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;border-radius:8px;margin-top:10px">Your video go show here 🎬</div>`);
f.innerHTML+=`<div class="post"><div class="post-head"><div class="avatar">F</div><div><b>${p.name}</b><div style="font-size:12px;color:#65676b">${p.time}</div></div></div><div style="margin-top:8px">${p.t}</div>${media}<div style="padding:6px 0;font-size:13px;color:#65676b">👍 ${p.likes} likes • ${p.likes*2} comments</div><div class="actions"><span onclick="like(${i})" style="color:${p.liked?'#0866ff':''}">👍 Like</span><span>💬 Comment</span><span>↗️ Share</span></div></div>`;
if(p.video || p.img){
rf.innerHTML+=`<div style="position:relative"><video class="reel-video" src="${p.video||p.img}" controls loop></video><div style="position:absolute;bottom:20px;left:12px;color:#fff;text-shadow:0 1px 3px #000"><b>@${p.name}</b><br>${p.t}<br><br>❤️ ${p.likes} 💬 ${p.likes*2}</div></div>`;
}
});
}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');document.getElementById('txt').value='';document.getElementById('preview').innerHTML='';document.getElementById('preview').style.display='none';tempMedia=null}
document.getElementById('file').addEventListener('change',e=>{
let file=e.target.files[0]; if(!file) return;
let r=new FileReader(); r.onload=ev=>{
tempMedia=ev.target.result; tempType=file.type.startsWith('video')?'video':'image';
let pv=document.getElementById('preview'); pv.style.display='block';
pv.innerHTML=tempType=='video'?`<video src="${tempMedia}" controls style="width:100%;border-radius:8px"></video>`:`<img src="${tempMedia}" style="width:100%;border-radius:8px">`;
}; r.readAsDataURL(file);
});
function makePost(){
let t=document.getElementById('txt').value;
if(!t &&!tempMedia) return alert('Write something or add video');
let newPost={t:t, likes:0, liked:false, name:"Franko", time:"now • 🌍"};
if(tempType=='video') newPost.video=tempMedia; else if(tempType=='image') newPost.img=tempMedia;
posts.unshift(newPost);
localStorage.setItem('fw4',JSON.stringify(posts));
render(); closeModal();
}
function like(i){posts[i].liked=!posts[i].liked; posts[i].likes+=posts[i].liked?1:-1; localStorage.setItem('fw4',JSON.stringify(posts)); render();}
function showPage(p,el){
document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
if(p=='home') document.getElementById('homePage').classList.add('active');
if(p=='reels') document.getElementById('reelsPage').classList.add('active');
el.classList.add('active');
}
render();
</script>
</body>
</html>
