<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FrankoWorld V1.1 - Secure</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:system-ui;background:#0f0f0f;color:#fff}
.h{display:flex;justify-content:space-between;padding:12px;background:#000;border-bottom:1px solid #222;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}.logo span{color:#ff3c00}
.p{max-width:600px;margin:0 auto;padding:12px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;background:#222;border:1px solid #333;color:#fff;padding:12px;border-radius:8px;margin:6px 0;box-sizing:border-box}
button{background:#ff3c00;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.small{color:#888;font-size:12px}
.post{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin-bottom:12px}
.post img,.post video{width:100%;border-radius:8px;margin-top:8px}
.actions{display:flex;gap:16px;margin-top:10px;font-size:14px}
.actions span{cursor:pointer}
</style></head><body>
<div class="h"><div class="logo">FRANKO<span>WORLD</span> V1.1</div><div id="uInfo" class="small">Not logged in</div></div>
<div class="p">
<div class="card">
<b>🔐 Account</b><br>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<input id="username" placeholder="Username (e.g Franko)">
<div style="display:flex;gap:8px;margin-top:8px">
<button onclick="signup()">Sign Up</button>
<button onclick="login()" style="background:#333">Login</button>
<button onclick="logout()" style="background:#222">Logout</button>
</div>
<div id="aMsg" class="small" style="margin-top:8px"></div>
</div>

<div class="card">
<b>📝 Create Post</b><br>
<textarea id="txt" placeholder="What's happening?"></textarea>
<input type="file" id="file" accept="image/*,video/*">
<button onclick="createPost()" id="pBtn">Post to World</button>
<div id="pMsg" class="small"></div>
</div>

<div id="feed"><div class="small">Loading feed... Run SQL in Supabase first if empty</div></div>
</div>

<script>
const SUPABASE_URL="https://jayrsmwemaraibmbvktm.supabase.co";
const SUPABASE_KEY="sb_publishable_XpGNPeMHY6hmkoajBKC2gg_dUrcQGVg";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let user=null;

async function checkUser(){
 const {data}=await sb.auth.getUser();
 user=data.user;
 document.getElementById('uInfo').innerText=user?"✅ "+user.email:"Not logged in";
 if(user) document.getElementById('aMsg').innerText="Logged in: "+user.email;
}
checkUser();

async function signup(){
 const email=document.getElementById('email').value;
 const pass=document.getElementById('pass').value;
 const username=document.getElementById('username').value || email.split('@')[0];
 if(!email||!pass){alert("Put email & password");return}
 const {data,error}=await sb.auth.signUp({email,password:pass});
 if(error){document.getElementById('aMsg').innerText=error.message;return}
 if(data.user){
   await sb.from('profiles').insert({id:data.user.id, username:username});
   document.getElementById('aMsg').innerText="Account created! Now Login.";
 }
 checkUser();
}
async function login(){
 const email=document.getElementById('email').value;
 const pass=document.getElementById('pass').value;
 const {error}=await sb.auth.signInWithPassword({email,password:pass});
 document.getElementById('aMsg').innerText=error?error.message:"Logged in!";
 checkUser(); loadFeed();
}
async function logout(){await sb.auth.signOut();user=null;checkUser();document.getElementById('aMsg').innerText="Logged out";}

async function createPost(){
 if(!user){alert("Login first!");return}
 const txt=document.getElementById('txt').value;
 const file=document.getElementById('file').files[0];
 if(!txt&&!file){alert("Type something or pick image");return}
 document.getElementById('pBtn').disabled=true;
 document.getElementById('pMsg').innerText="Posting...";
 let media_url=null;
 if(file){
   const name=Date.now()+"_"+file.name.replace(/\s/g,'_');
   const {error}=await sb.storage.from('posts').upload(name,file);
   if(error){document.getElementById('pMsg').innerText=error.message;document.getElementById('pBtn').disabled=false;return}
   const {data}=sb.storage.from('posts').getPublicUrl(name);
   media_url=data.publicUrl;
 }
 const {error}=await sb.from('posts').insert({user_id:user.id, content:txt, media_url:media_url});
 document.getElementById('pMsg').innerText=error?error.message:"Posted! 🔥";
 document.getElementById('txt').value="";document.getElementById('file').value="";
 document.getElementById('pBtn').disabled=false;
 loadFeed();
}

async function loadFeed(){
 const {data:posts,error}=await sb.from('posts').select('*, profiles(username), likes(count), comments(count)').order('created_at',{ascending:false}).limit(50);
 if(error){
   // fallback simple query
   const {data:d2,error:e2}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(50);
   if(e2){document.getElementById('feed').innerHTML="<div class='small'>"+e2.message+"<br>Go Supabase > SQL Editor > Run secure SQL I gave you</div>";return}
   renderFeed(d2);
   return
 }
 renderFeed(posts);
}
function renderFeed(posts){
 if(!posts||!posts.length){document.getElementById('feed').innerHTML="<div class='small'>No posts yet. Be first!</div>";return}
 let html="";
 posts.forEach(p=>{
   const name=p.profiles? p.profiles.username : "User";
   const isImg=p.media_url && p.media_url.match(/\.(jpeg|jpg|png|gif|webp)/i);
   const media=p.media_url? (isImg?`<img src="${p.media_url}">`:`<video src="${p.media_url}" controls></video>`) : "";
   html+=`<div class="post">
   <div style="display:flex;justify-content:space-between"><b>${name}</b><span class="small">${new Date(p.created_at).toLocaleString()}</span></div>
   <div style="margin:8px 0">${(p.content||"")}</div>
   ${media}
   <div class="actions">
   <span onclick="likePost('${p.id}')">❤️ Like</span>
   <span onclick="commentNow('${p.id}')">💬 Comment</span>
   ${user && p.user_id===user.id? `<span onclick="delPost('${p.id}')" style="color:#ff4444">🗑️ Delete</span>` : ""}
   </div>
   </div>`;
 });
 document.getElementById('feed').innerHTML=html;
}
async function likePost(id){
 if(!user){alert("Login to like");return}
 const {error}=await sb.from('likes').insert({post_id:id, user_id:user.id});
 if(error && error.message.includes("duplicate")){await sb.from('likes').delete().eq('post_id',id).eq('user_id',user.id); alert("Unliked!");}
 else if(error){alert(error.message);} else {alert("Liked! ❤️");} loadFeed();
}
async function commentNow(id){
 if(!user){alert("Login first");return}
 const c=prompt("Your comment:");
 if(!c) return;
 const {error}=await sb.from('comments').insert({post_id:id, user_id:user.id, content:c});
 if(error) alert(error.message); else {alert("Comment added!"); loadFeed();}
}
async function delPost(id){if(!confirm("Delete this post?")) return; const {error}=await sb.from('posts').delete().eq('id',id); if(error) alert(error.message); else loadFeed();}
loadFeed();
setInterval(loadFeed,10000);
</script></body></html>
