<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrankoWorld - Connect the World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f0f2f5}
header{background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.1);position:sticky;top:0;z-index:100;padding:10px 20px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:28px;font-weight:800;color:#1877f2}.logo span{color:#42b72a}
.search{flex:1;max-width:400px;margin:0 20px}
.search input{width:100%;padding:10px 15px;border-radius:20px;border:none;background:#f0f2f5}
.container{display:flex;max-width:1200px;margin:20px auto;gap:20px;padding:0 10px}
.main{flex:1;max-width:600px;margin:auto}
.create-post{background:#fff;border-radius:8px;padding:15px;margin-bottom:15px}
.create-top{display:flex;gap:10px;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:#1877f2;color:#fff;display:grid;place-items:center;font-weight:700}
.create-top input{flex:1;padding:10px 15px;border-radius:20px;border:none;background:#f0f2f5}
.post{background:#fff;border-radius:8px;margin-bottom:15px;box-shadow:0 1px 2px rgba(0,0,0,.1);overflow:hidden}
.post-head{display:flex;gap:10px;padding:15px;align-items:center}
.post-content{padding:0 15px 10px;font-size:15px}
.post-img{width:100%;height:280px;background:linear-gradient(135deg,#667eea,#764ba2);display:grid;place-items:center;color:#fff;font-size:60px}
.post-stats{display:flex;justify-content:space-between;padding:10px 15px;color:#65676b;font-size:13px;border-bottom:1px solid #eee}
.post-btns{display:flex;justify-content:space-around;padding:5px}
.post-btn{flex:1;display:flex;justify-content:center;gap:6px;padding:8px;border-radius:6px;cursor:pointer;font-weight:600;color:#65676b}
</style>
</head>
<body>
<header>
<div class="logo">franko<span>world</span></div>
<div class="search"><input placeholder=" Search FrankoWorld"></div>
<div style="font-weight:700">👤</div>
</header>
<div class="container">
<div class="main">
<div class="create-post">
<div class="create-top">
<div class="avatar">FB</div>
<input id="postInput" placeholder="What's on your mind, Franko? Press Enter to post">
</div>
</div>
<div id="feed">
<div class="post">
<div class="post-head"><div class="avatar" style="background:#42b72a">JD</div><div><h4>John Doe</h4><p style="font-size:12px;color:#666">2 hrs ago</p></div></div>
<div class="post-content">Welcome to FrankoWorld! 🚀 The new social platform built by Franko Boss. This is Facebook-like but yours! 🔥</div>
<div class="post-img">🌍</div>
<div class="post-stats"><span>❤️ 245 Likes</span><span>42 Comments</span></div>
<div class="post-btns"><div class="post-btn">👍 Like</div><div class="post-btn">💬 Comment</div><div class="post-btn">↗️ Share</div></div>
</div>
</div>
</div>
</div>
<script>
const feed=document.getElementById('feed');
const input=document.getElementById('postInput');
input.addEventListener('keypress',(e)=>{
 if(e.key==='Enter' && input.value.trim()){
  const post=document.createElement('div');
  post.className='post';
  post.innerHTML=`<div class="post-head"><div class="avatar">FB</div><div><h4>Franko Boss</h4><p style="font-size:12px;color:#666">Just now</p></div></div><div class="post-content">${input.value}</div><div class="post-stats"><span>❤️ 1 Like</span><span>0 Comments</span></div><div class="post-btns"><div class="post-btn">👍 Like</div><div class="post-btn">💬 Comment</div><div class="post-btn">↗️ Share</div></div>`;
  feed.prepend(post);
  input.value='';
 }
});
</script>
</body>
</html>
