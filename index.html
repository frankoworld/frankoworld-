<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FrankoWorld V2 🌍</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0a0a0a;color:#fff}
.header{background:linear-gradient(135deg,#ff6a00,#ffcc00);padding:20px;text-align:center;position:sticky;top:0;z-index:99}
.header h1{color:#000;font-weight:900;font-size:28px}
.header p{color:#000;font-weight:700;font-size:14px}
.container{max-width:600px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;text-align:center;padding:12px;background:#1a1a1a;border-radius:12px;border:1px solid #333;cursor:pointer;font-weight:600}
.tab.active{background:#ffcc00;color:#000;font-weight:900}
.card{background:#1a1a1a;border-radius:16px;padding:16px;margin-bottom:16px;border:1px solid #2a2a2a}
.input{width:100%;background:#262626;border:1px solid #444;border-radius:12px;padding:14px;color:#fff;margin-bottom:10px;font-size:15px}
.btn{width:100%;background:linear-gradient(135deg,#ff6a00,#ffcc00);color:#000;border:none;border-radius:12px;padding:14px;font-weight:900;font-size:16px;cursor:pointer}
.post{background:#1e1e1e;border-radius:14px;padding:14px;margin-bottom:12px;border-left:3px solid #ff6a00}
</style>
</head>
<body>
<div class="header"><h1>FRANKO WORLD 🌍</h1><p>Naija No.1 Comedy Hub 🔥</p></div>
<div class="container">
<div class="tabs">
<div class="tab active" onclick="showTab('feed',this)">Feed</div>
<div class="tab" onclick="showTab('videos',this)">Videos</div>
<div class="tab" onclick="showTab('about',this)">About</div>
</div>
<div id="feed">
<div class="card">
<input class="input" id="user" placeholder="Your username (e.g. Franko)">
<input class="input" id="text" placeholder="What's happening? Share comedy...">
<button class="btn" onclick="makePost()">Post to World 🚀</button>
</div>
<div id="posts"></div>
</div>
<div id="videos" style="display:none"><div class="card"><h3>🎬 Videos</h3><p style="color:#aaa;margin-top:10px">Your comedy skits go show here! Upload coming soon.</p></div></div>
<div id="about" style="display:none"><div class="card"><h3>About</h3><p style="color:#ccc;margin-top:10px;line-height:1.6">FrankoWorld built by Franko. From CodePen to world! Naija to the world 🌍<br><br>✅ No email wahala<br>✅ Instant posting<br>✅ Made in Naija</p></div></div>
</div>
<script>
let posts=JSON.parse(localStorage.getItem('fw_posts')||'[]');
if(posts.length==0){posts=[{u:'Franko',t:'Welcome to FrankoWorld V2! 🌍 No more 22 secs error! First official post! 🔥',d:'Just now'}];}
function render(){document.getElementById('posts').innerHTML=posts.map(p=>`<div class=post><b style=color:#ffcc00>@${p.u}</b><p style=margin:8px 0>${p.t}</p><small style=color:#777>${p.d}</small></div>`).join('');}
function makePost(){let u=document.getElementById('user').value||'Anonymous';let t=document.getElementById('text').value;if(!t)return alert('Type something boss!');posts.unshift({u:u,t:t,d:new Date().toLocaleString()});localStorage.setItem('fw_posts',JSON.stringify(posts));document.getElementById('text').value='';render();}
function showTab(name,el){document.getElementById('feed').style.display=name=='feed'?'block':'none';document.getElementById('videos').style.display=name=='videos'?'block':'none';document.getElementById('about').style.display=name=='about'?'block':'none';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
render();
</script>
</body>
</html>
